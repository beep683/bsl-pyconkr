[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lunch-agent"
version = "0.1.0"
description = "Microsoft Agent Framework service for school lunch comparison"
requires-python = ">=3.12"
dependencies = [
  "agent-framework-ag-ui==1.1.0",
  "agent-framework-github-copilot==1.0.2",
  "agent-framework-orchestrations==1.1.0",
  "fastapi>=0.138,<1",
  "mcp>=1.28,<2",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
devui = [
  "agent-framework-devui==1.0.0b260813",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
